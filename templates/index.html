<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>
<body>

    <h1>🎓 Student Management System</h1>
    <p>
    <a href="/add">➕ Add Student</a>
</p>

    <h3>Student Records</h3>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
            <td>{{ student[5] }}</td>
            <td>
  <td>
    <a href="/update/{{ student[0] }}">
        Update
    </a>

    |

    <a href="/delete/{{ student[0] }}">
        Delete
    </a>
</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
