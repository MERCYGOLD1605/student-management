<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>
</head>
<body>

    <h1>Update Student</h1>

    <form method="POST">

        <label>Name:</label><br>
        <input type="text" name="name" value="{{ student[1] }}" required><br><br>

        <label>Age:</label><br>
        <input type="number" name="age" value="{{ student[2] }}" required><br><br>

        <label>Course:</label><br>
        <input type="text" name="course" value="{{ student[3] }}" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" value="{{ student[4] }}" required><br><br>

        <label>Phone:</label><br>
        <input type="text" name="phone" value="{{ student[5] }}" required><br><br>

        <button type="submit">Update Student</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
